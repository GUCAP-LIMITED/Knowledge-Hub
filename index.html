<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply the stored/system theme before first paint so dark users never see a light flash.
         Keep the key and resolution order in sync with src/app/theme/ThemeProvider.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('uapp:theme');
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          /* storage or matchMedia unavailable: stay on the default light theme */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Lexend+Deca:wght@400;600;700&family=Alex+Brush&display=swap"
      rel="stylesheet"
    />
    <title>UAPP Academy — Knowledge Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
